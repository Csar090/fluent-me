<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fluent Me - Hardware Diagnostic</title>
  <style>
    body {
      background-color: #121212;
      color: #f3f4f6;
      font-family: monospace;
      padding: 16px;
      margin: 0;
    }
    h1 { font-size: 1.2rem; color: #3b82f6; margin-bottom: 8px; }
    .card {
      background-color: #1e1e1e;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .card-title { font-weight: bold; color: #9ca3af; margin-bottom: 8px; font-size: 0.85rem; }
    button {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: none;
      background-color: #3b82f6;
      color: white;
      font-weight: bold;
      font-size: 1rem;
      margin-bottom: 8px;
    }
    .pass { color: #10b981; font-weight: bold; }
    .fail { color: #ef4444; font-weight: bold; }
    .warn { color: #f59e0b; font-weight: bold; }
    .log-box {
      background-color: #0d1117;
      color: #8b949e;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.75rem;
      white-space: pre-wrap;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>

  <h1>Diagnostic Suite</h1>

  <div class="card">
    <button id="runBtn">RUN DIAGNOSTIC TESTS</button>
  </div>

  <div class="card">
    <div class="card-title">Test 1: Hardware Mic Signal</div>
    <div id="test1Result">Pending...</div>
  </div>

  <div class="card">
    <div class="card-title">Test 2: Chrome Speech Engine Events</div>
    <div id="test2Result">Pending...</div>
  </div>

  <div class="card">
    <div class="card-title">Test 3: Synthetic Audio WASM/ONNX</div>
    <div id="test3Result">Pending...</div>
  </div>

  <div class="card">
    <div class="card-title">Diagnostic Log</div>
    <div class="log-box" id="logBox">Tap button to start...</div>
  </div>

  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';
    env.allowLocalModels = false;

    const logBox = document.getElementById('logBox');
    const runBtn = document.getElementById('runBtn');
    const test1Result = document.getElementById('test1Result');
    const test2Result = document.getElementById('test2Result');
    const test3Result = document.getElementById('test3Result');

    function log(msg) {
      logBox.innerText = `[${new Date().toLocaleTimeString()}] ${msg}\n` + logBox.innerText;
    }

    runBtn.addEventListener('click', async () => {
      runBtn.disabled = true;
      log('Starting Diagnostic Tests...');

      // --- TEST 1: RAW MIC HARDWARE CHECK ---
      test1Result.innerHTML = 'Testing raw mic signal...';
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }
        });

        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (ctx.state === 'suspended') await ctx.resume();

        const src = ctx.createMediaStreamSource(stream);
        const processor = ctx.createScriptProcessor(2048, 1, 1);
        let samplesCaptured = [];

        processor.onaudioprocess = (e) => {
          const data = e.inputBuffer.getChannelData(0);
          for (let i = 0; i < data.length; i++) {
            samplesCaptured.push(Math.abs(data[i]));
          }
        };

        src.connect(processor);
        processor.connect(ctx.destination);

        await new Promise(r => setTimeout(r, 1500)); // Collect 1.5s of audio

        processor.disconnect();
        stream.getTracks().forEach(t => t.stop());
        ctx.close();

        let maxAmp = Math.max(...samplesCaptured);
        let sum = samplesCaptured.reduce((a, b) => a + b, 0);
        let avgAmp = sum / samplesCaptured.length;

        log(`Mic Samples: ${samplesCaptured.length}, Max Peak: ${maxAmp.toFixed(5)}, Avg: ${avgAmp.toFixed(5)}`);

        if (maxAmp === 0) {
          test1Result.innerHTML = `<span class="fail">FAIL: Pure Silence (0.0000). Android OS/Chrome is blocking mic audio.</span>`;
        } else if (maxAmp < 0.005) {
          test1Result.innerHTML = `<span class="warn">WARNING: Audio extremely quiet (${maxAmp.toFixed(4)}). Check mic volume.</span>`;
        } else {
          test1Result.innerHTML = `<span class="pass">PASS: Hardware mic working! Peak signal: ${maxAmp.toFixed(4)}</span>`;
        }

      } catch (err) {
        test1Result.innerHTML = `<span class="fail">FAIL: Mic Permission/Hardware Error: ${err.message}</span>`;
        log(`Test 1 Error: ${err.message}`);
      }

      // --- TEST 2: NATIVE SPEECH ENGINE EVENT INSPECTOR ---
      test2Result.innerHTML = 'Testing Chrome Speech Engine...';
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

      if (!SpeechRecognition) {
        test2Result.innerHTML = `<span class="fail">FAIL: webkitSpeechRecognition API missing in this browser.</span>`;
      } else {
        const rec = new SpeechRecognition();
        rec.continuous = false;
        rec.interimResults = false;
        rec.lang = 'en-US';

        let eventsLogged = [];

        rec.onstart = () => eventsLogged.push('onstart');
        rec.onaudiostart = () => eventsLogged.push('onaudiostart');
        rec.onsoundstart = () => eventsLogged.push('onsoundstart');
        rec.onspeechstart = () => eventsLogged.push('onspeechstart');
        rec.onresult = (e) => {
          eventsLogged.push('onresult');
          const txt = e.results[0][0].transcript;
          log(`Speech Engine Result: "${txt}"`);
        };
        rec.onerror = (e) => {
          eventsLogged.push(`onerror:${e.error}`);
          log(`Speech Engine Error Event: ${e.error}`);
        };
        rec.onend = () => {
          eventsLogged.push('onend');
          log(`Speech Engine Sequence: ${eventsLogged.join(' -> ')}`);

          if (eventsLogged.includes('onerror:network')) {
            test2Result.innerHTML = `<span class="fail">FAIL: Network Error. Google Speech Service blocked or offline.</span>`;
          } else if (eventsLogged.includes('onerror:no-speech')) {
            test2Result.innerHTML = `<span class="warn">NO SPEECH: Google Speech Engine detected no audio input.</span>`;
          } else if (eventsLogged.includes('onresult')) {
            test2Result.innerHTML = `<span class="pass">PASS: Chrome Speech Engine Working!</span>`;
          } else {
            test2Result.innerHTML = `<span class="warn">ENDED: Events captured: ${eventsLogged.join(', ')}</span>`;
          }
        };

        try {
          rec.start();
          log('Speech Engine started. Speak now...');
          await new Promise(r => setTimeout(r, 4000));
          rec.stop();
        } catch (e) {
          test2Result.innerHTML = `<span class="fail">FAIL: Could not start: ${e.message}</span>`;
        }
      }

      // --- TEST 3: SYNTHETIC AUDIO ONNX/WASM INFERENCE ---
      test3Result.innerHTML = 'Testing Whisper WASM with synthetic audio...';
      try {
        log('Loading Whisper model for synthetic tensor check...');
        const pipe = await pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny.en');

        // Create 2 seconds of 440Hz synthetic audio tone
        const synthPCM = new Float32Array(32000);
        for (let i = 0; i < synthPCM.length; i++) {
          synthPCM[i] = Math.sin(2 * Math.PI * 440 * (i / 16000)) * 0.5;
        }

        log('Feeding synthetic audio into Whisper...');
        const out = await pipe(synthPCM);
        log(`Synthetic audio result: ${JSON.stringify(out)}`);

        test3Result.innerHTML = `<span class="pass">PASS: WASM ONNX Engine functional! Output: ${JSON.stringify(out)}</span>`;

      } catch (err) {
        test3Result.innerHTML = `<span class="fail">FAIL: WASM ONNX Inference Error: ${err.message}</span>`;
        log(`Test 3 Error: ${err.message}`);
      }

      runBtn.disabled = false;
      log('Diagnostic Suite Completed.');
    });
  </script>
</body>
</html>
