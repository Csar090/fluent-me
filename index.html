<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fluent Me - Layer 2: Fixed STT</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --primary: #3b82f6;
      --danger: #ef4444;
      --success: #10b981;
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --border: #374151;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    header {
      text-align: center;
      padding: 8px 0;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 700;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
    }

    .card-title {
      font-size: 0.85rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .status-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      background-color: rgba(59, 130, 246, 0.1);
      border: 1px solid var(--primary);
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 500;
    }

    .badge {
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 700;
    }
    .badge-loading { background-color: #f59e0b; color: #000; }
    .badge-ready { background-color: var(--success); color: #000; }
    .badge-busy { background-color: var(--primary); color: #fff; }

    .recorder-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 20px 16px;
      text-align: center;
    }

    .timer {
      font-size: 2.5rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    canvas {
      width: 100%;
      height: 50px;
      background-color: #111827;
      border-radius: 8px;
      border: 1px solid var(--border);
    }

    .btn-record {
      width: 100%;
      max-width: 280px;
      height: 56px;
      border-radius: 28px;
      border: none;
      background-color: var(--primary);
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s, transform 0.1s;
    }

    .btn-record:disabled {
      background-color: #4b5563;
      cursor: not-allowed;
      opacity: 0.6;
    }

    .btn-record.recording {
      background-color: var(--danger);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
      70% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
      100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }

    audio {
      width: 100%;
      margin-top: 8px;
      border-radius: 8px;
    }

    .transcript-box {
      min-height: 80px;
      background-color: #0d1117;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #e5e7eb;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-top: 8px;
    }

    .log-box {
      font-family: monospace;
      font-size: 0.75rem;
      background-color: #0d1117;
      color: #8b949e;
      padding: 10px;
      border-radius: 8px;
      max-height: 120px;
      overflow-y: auto;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>FLUENT ME</h1>
      <p>Layer 2: Fixed Local AI STT</p>
    </header>

    <div class="status-banner">
      <span id="modelStatusText">Initializing local STT model...</span>
      <span class="badge badge-loading" id="modelBadge">LOADING</span>
    </div>

    <div class="card recorder-box">
      <div class="timer" id="timerDisplay">00:00</div>
      
      <canvas id="visualizer"></canvas>

      <button id="recordBtn" class="btn-record" disabled>
        <span>🎙</span> <span id="btnText">Loading Model...</span>
      </button>

      <audio id="audioPlayback" controls style="display: none;"></audio>
    </div>

    <div class="card">
      <div class="card-title">Live Transcript</div>
      <div class="transcript-box" id="transcriptDisplay">Your transcript will appear here after recording...</div>
      <div class="stats-row">
        <span id="transcribeTimeStat">Inference Time: -</span>
        <span id="audioDurationStat">Audio Length: -</span>
      </div>
    </div>

    <div class="card">
      <div class="card-title">System Log</div>
      <div class="log-box" id="logBox">Initializing fix...</div>
    </div>
  </div>

  <script type="module">
    import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

    env.allowLocalModels = false;

    const logBox = document.getElementById('logBox');
    const timerDisplay = document.getElementById('timerDisplay');
    const recordBtn = document.getElementById('recordBtn');
    const btnText = document.getElementById('btnText');
    const audioPlayback = document.getElementById('audioPlayback');
    const transcriptDisplay = document.getElementById('transcriptDisplay');
    const modelStatusText = document.getElementById('modelStatusText');
    const modelBadge = document.getElementById('modelBadge');
    const transcribeTimeStat = document.getElementById('transcribeTimeStat');
    const audioDurationStat = document.getElementById('audioDurationStat');
    const canvas = document.getElementById('visualizer');
    const canvasCtx = canvas.getContext('2d');

    let transcriber = null;
    let audioContext = null;
    let micStream = null;
    let scriptProcessor = null;
    let pcmChunks = [];
    let isRecording = false;
    let animFrameId = null;
    let startTime = 0;
    let timerInterval = null;
    let wakeLock = null;

    function log(msg) {
      const timestamp = new Date().toLocaleTimeString();
      logBox.innerText = `[${timestamp}] ${msg}\n` + logBox.innerText;
    }

    function setModelStatus(text, badgeText, badgeClass) {
      modelStatusText.innerText = text;
      modelBadge.innerText = badgeText;
      modelBadge.className = `badge ${badgeClass}`;
    }

    // 1. Initialize Model
    async function initModel() {
      try {
        log('Loading Xenova/whisper-tiny.en model...');
        setModelStatus('Loading Whisper Model...', 'LOADING', 'badge-loading');

        transcriber = await pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny.en', {
          progress_callback: (data) => {
            if (data.status === 'progress') {
              const pct = Math.round(data.progress || 0);
              setModelStatus(`Loading Model (${pct}%)...`, 'LOADING', 'badge-loading');
            }
          }
        });

        log('Whisper model ready.');
        setModelStatus('Local AI Model Ready', 'READY', 'badge-ready');
        recordBtn.disabled = false;
        btnText.innerText = 'Start Recording';
      } catch (err) {
        log(`Model load error: ${err.message}`);
        setModelStatus('Failed to load model', 'ERROR', 'badge-loading');
      }
    }

    // 2. Visualizer
    function drawVisualizer(analyser) {
      const bufferLength = analyser.frequencyBinCount;
      const dataArray = new Uint8Array(bufferLength);
      
      function render() {
        if (!isRecording) return;
        animFrameId = requestAnimationFrame(render);
        analyser.getByteFrequencyData(dataArray);

        canvasCtx.fillStyle = '#111827';
        canvasCtx.fillRect(0, 0, canvas.width, canvas.height);

        const barWidth = (canvas.width / bufferLength) * 2.5;
        let x = 0;

        for (let i = 0; i < bufferLength; i++) {
          const barHeight = (dataArray[i] / 255) * canvas.height;
          canvasCtx.fillStyle = '#3b82f6';
          canvasCtx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
          x += barWidth + 1;
        }
      }
      render();
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen');
      } catch (err) {}
    }

    function releaseWakeLock() {
      if (wakeLock) {
        wakeLock.release().then(() => wakeLock = null);
      }
    }

    function startTimer() {
      startTime = Date.now();
      timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const mins = String(Math.floor(elapsed / 60)).padStart(2, '0');
        const secs = String(elapsed % 60).padStart(2, '0');
        timerDisplay.innerText = `${mins}:${secs}`;
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    function resampleTo16k(audioChunks, sourceSampleRate) {
      let totalLength = audioChunks.reduce((acc, curr) => acc + curr.length, 0);
      let merged = new Float32Array(totalLength);
      let offset = 0;
      for (let chunk of audioChunks) {
        merged.set(chunk, offset);
        offset += chunk.length;
      }

      if (sourceSampleRate === 16000) return merged;

      const ratio = sourceSampleRate / 16000;
      const newLength = Math.round(merged.length / ratio);
      const result = new Float32Array(newLength);
      for (let i = 0; i < newLength; i++) {
        const srcIndex = Math.floor(i * ratio);
        result[i] = merged[srcIndex];
      }
      return result;
    }

    function createWavBlob(float32Array, sampleRate = 16000) {
      const buffer = new ArrayBuffer(44 + float32Array.length * 2);
      const view = new DataView(buffer);

      function writeString(offset, string) {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      }

      writeString(0, 'RIFF');
      view.setUint32(4, 36 + float32Array.length * 2, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true);
      view.setUint16(22, 1, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * 2, true);
      view.setUint16(32, 2, true);
      view.setUint16(34, 16, true);
      writeString(36, 'data');
      view.setUint32(40, float32Array.length * 2, true);

      let offset = 44;
      for (let i = 0; i < float32Array.length; i++) {
        let s = Math.max(-1, Math.min(1, float32Array[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
        offset += 2;
      }

      return new Blob([buffer], { type: 'audio/wav' });
    }

    async function startRecording() {
      try {
        pcmChunks = [];
        micStream = await navigator.mediaDevices.getUserMedia({ audio: true });

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const nativeSampleRate = audioContext.sampleRate;

        const source = audioContext.createMediaStreamSource(micStream);
        const analyser = audioContext.createAnalyser();
        analyser.fftSize = 64;

        scriptProcessor = audioContext.createScriptProcessor(4096, 1, 1);

        scriptProcessor.onaudioprocess = (e) => {
          if (!isRecording) return;
          const channelData = e.inputBuffer.getChannelData(0);
          pcmChunks.push(new Float32Array(channelData));
        };

        source.connect(analyser);
        source.connect(scriptProcessor);
        scriptProcessor.connect(audioContext.destination);

        isRecording = true;
        await requestWakeLock();
        startTimer();
        drawVisualizer(analyser);

        recordBtn.classList.add('recording');
        btnText.innerText = 'Stop & Transcribe';
        audioPlayback.style.display = 'none';
        log(`Recording PCM @ ${nativeSampleRate} Hz...`);

      } catch (err) {
        log(`Microphone error: ${err.message}`);
        alert('Could not access microphone.');
      }
    }

    async function stopRecording() {
      isRecording = false;
      stopTimer();
      releaseWakeLock();
      cancelAnimationFrame(animFrameId);

      if (scriptProcessor) scriptProcessor.disconnect();
      if (micStream) micStream.getTracks().forEach(t => t.stop());

      recordBtn.classList.remove('recording');
      btnText.innerText = 'Start Recording';
      recordBtn.disabled = true;

      const nativeSampleRate = audioContext ? audioContext.sampleRate : 44100;
      if (audioContext) audioContext.close();

      const pcm16k = resampleTo16k(pcmChunks, nativeSampleRate);
      
      let sum = 0;
      for (let i = 0; i < pcm16k.length; i++) sum += pcm16k[i] * pcm16k[i];
      const rms = Math.sqrt(sum / pcm16k.length);
      const audioDuration = (pcm16k.length / 16000).toFixed(1);

      log(`Samples: ${pcm16k.length} (${audioDuration}s). Volume RMS: ${rms.toFixed(4)}`);

      const wavBlob = createWavBlob(pcm16k, 16000);
      audioPlayback.src = URL.createObjectURL(wavBlob);
      audioPlayback.style.display = 'block';

      try {
        setModelStatus('Transcribing Locally...', 'PROCESSING', 'badge-busy');
        transcriptDisplay.innerText = 'Transcribing direct PCM on device...';

        const t0 = performance.now();
        
        // Pass PCM array directly without invalid multilingual flags
        const output = await transcriber(pcm16k);
        const t1 = performance.now();

        const processSec = ((t1 - t0) / 1000).toFixed(2);
        
        // Handle both Array and Object output formats
        log(`Raw output: ${JSON.stringify(output)}`);
        const extractedText = Array.isArray(output) ? output[0]?.text : output?.text;
        
        transcriptDisplay.innerText = (extractedText && extractedText.trim()) || '[No speech detected]';
        transcribeTimeStat.innerText = `Inference Time: ${processSec}s`;
        audioDurationStat.innerText = `Audio Length: ${audioDuration}s`;

        log(`Transcription complete in ${processSec}s.`);
        setModelStatus('Local AI Model Ready', 'READY', 'badge-ready');

      } catch (err) {
        log(`Inference error: ${err.message}`);
        transcriptDisplay.innerText = 'Error processing speech locally.';
        setModelStatus('Transcription Error', 'ERROR', 'badge-loading');
      } finally {
        recordBtn.disabled = false;
      }
    }

    recordBtn.addEventListener('click', () => {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      initModel();
    });
  </script>
</body>
</html>
